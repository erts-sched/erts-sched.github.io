<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <nav aria-label="site">
      <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="sections">
        <a href="{{ '/#security-research' | relative_url }}"{% if page.url contains '/security/' %} aria-current="true"{% endif %}>Security research</a>
        <a href="{{ '/#measurements' | relative_url }}">Measurements</a>
        <a href="https://github.com/erts-sched" target="_blank" rel="noopener">GitHub</a>
      </span>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site">
    <span>{{ site.description }}</span><span class="sep" aria-hidden="true">·</span><a href="https://github.com/erts-sched" target="_blank" rel="noopener">github.com/erts-sched</a>
  </footer>
  <script>
    // external links open in a new tab; internal ones stay in this one
    for (const a of document.querySelectorAll('main a[href^="http"]')) {
      if (a.hostname !== location.hostname) {
        a.target = "_blank"; a.rel = "noopener";
      }
    }
    // tables keep table semantics; a focusable region scrolls them sideways
    for (const t of document.querySelectorAll("main table")) {
      const w = document.createElement("div"); w.className = "table-wrap"; w.tabIndex = 0; w.setAttribute("role", "region"); w.setAttribute("aria-label", "table, scrolls sideways");
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    }
  </script>
</body>
</html>
